<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KemProMed | Enterprise AI Infrastructure</title>

<style>

:root{
    --bg:#050816;
    --card:#0F172A;
    --border:#1E293B;
    --cyan:#00D4B2;
    --blue:#2563EB;
    --text:#FFFFFF;
    --gray:#94A3B8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:
    radial-gradient(circle at top right,#00d4b215 0%,transparent 35%),
    radial-gradient(circle at bottom left,#2563eb15 0%,transparent 40%),
    var(--bg);
    color:var(--text);
    line-height:1.6;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hero{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero h1{
    font-size:3.5rem;
    margin-bottom:15px;
}

.hero .tag{
    color:var(--cyan);
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:bold;
}

.hero p{
    max-width:850px;
    margin:auto;
    color:var(--gray);
    font-size:1.1rem;
}

.founder{
    margin-top:25px;
    color:#cbd5e1;
    font-size:.95rem;
}

.btns{
    margin-top:35px;
}

.btn{
    display:inline-block;
    margin:8px;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
    transition:.3s;
}

.btn-primary{
    background:var(--cyan);
    color:#000;
}

.btn-secondary{
    border:1px solid var(--border);
    color:white;
}

.btn:hover{
    transform:translateY(-3px);
}

.section{
    padding:70px 0;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
    font-size:2rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
    transition:.3s;
}

.card:hover{
    border-color:var(--cyan);
    transform:translateY(-6px);
}

.badge{
    display:inline-block;
    margin-bottom:15px;
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    color:var(--cyan);
    border:1px solid rgba(0,212,178,.4);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:var(--gray);
    margin-bottom:20px;
}

.card a{
    text-decoration:none;
    color:white;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    text-align:center;
    padding:25px;
}
